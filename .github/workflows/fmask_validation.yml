name: HLS Fmask Acceptance Validation

on:
  workflow_dispatch:
    inputs:
      candidate_s3_bucket:
        description: "S3 bucket containing candidate HLS outputs"
        required: true
        default: "hls-science-container-testing-018923174646-us-west-2-an"
      candidate_s3_prefix:
        description: "Candidate-output prefix"
        required: true
        default: "outputs/exp1-recompile/dev/"
      fmask_version:
        description: "Fmask version label"
        required: false
        default: "Fmask5.0"
  push:
    paths:
      - ".github/workflows/fmask_validation.yml"
      - "hls_validation_framework/config/fmask_acceptance_config.yaml"
      - "hls_validation_framework/notebooks/HLS_Fmask_acceptance_test.ipynb"
      - "hls_validation_framework/scripts/run_fmask_validation.py"

jobs:
  run-fmask-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: hls_validation_framework/environment.yml
          activate-environment: lpdaac_vitals
          auto-activate-base: false

      - name: Install Papermill
        shell: bash -l {0}
        run: pip install papermill

      - name: Override candidate configuration
        if: github.event_name == 'workflow_dispatch'
        shell: bash -l {0}
        run: |
          python - <<'PY'
          import yaml

          path = "hls_validation_framework/config/fmask_acceptance_config.yaml"
          with open(path, encoding="utf-8") as stream:
              config = yaml.safe_load(stream)
          config["candidate_s3_bucket"] = "${{ github.event.inputs.candidate_s3_bucket }}"
          config["candidate_s3_prefix"] = "${{ github.event.inputs.candidate_s3_prefix }}"
          config["fmask_version"] = "${{ github.event.inputs.fmask_version }}"
          with open(path, "w", encoding="utf-8") as stream:
              yaml.safe_dump(config, stream, sort_keys=False)
          PY

      - name: Run Fmask acceptance test
        shell: bash -l {0}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          python hls_validation_framework/scripts/run_fmask_validation.py \
            --output hls_validation_framework/reports/fmask_ci_${{ github.run_number }}.ipynb

      - name: Convert report to HTML
        if: always()
        shell: bash -l {0}
        run: |
          notebook="hls_validation_framework/reports/fmask_ci_${{ github.run_number }}.ipynb"
          [ -f "$notebook" ] && jupyter nbconvert --to html "$notebook"

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hls-fmask-validation-${{ github.run_number }}
          path: |
            hls_validation_framework/reports/fmask_ci_${{ github.run_number }}.html
            hls_validation_framework/reports/fmask_ci_${{ github.run_number }}.ipynb
            hls_validation_framework/reports/*.csv
          retention-days: 90
